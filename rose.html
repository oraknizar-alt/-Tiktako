<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt ve Giriş Yap</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; background: #121212; color: white; }
        .auth-container { background: #1e1e1e; padding: 20px; border-radius: 8px; display: flex; flex-direction: column; gap: 10px; width: 300px; }
        input, button { padding: 10px; border-radius: 4px; border: 1px solid #333; }
        input { background: #2a2a2a; color: white; }
        button { cursor: pointer; background: #3ecf8e; color: black; font-weight: bold; border: none; }
        button:hover { opacity: 0.9; }
    </style>
</head>
<body>

<div class="auth-container">
    <h2>Üyelik Sistemi</h2>
    <input type="email" id="email" placeholder="E-posta adresiniz">
    <input type="password" id="password" placeholder="Şifreniz">
    
    <button id="signup-btn">Kayıt Ol</button>
    <button id="login-btn">Giriş Yap</button>
</div>

<!-- Supabase Kütüphanesi -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Projenizin URL adresi ve Güvenli (Publishable) Anahtarı
  const SUPABASE_URL = 'https://sdwmmizixragaqiznsbc.supabase.co';
  const SUPABASE_ANON_KEY = 'sb_publishable_SQxZTUgb6-FteSXECd0aCA_mxu_-lTP';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Kayıt Olma İşlemi
  document.getElementById('signup-btn').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (!email || !password) {
      alert('Lütfen e-posta ve şifre girin.');
      return;
    }

    const { data, error } = await supabase.auth.signUp({ email, password });

    if (error) {
      alert('Kayıt Hatası: ' + error.message);
    } else {
      alert('Kayıt başarılı! E-posta adresinize doğrulama bağlantısı gönderilmiş olabilir.');
    }
  });

  // Giriş Yapma İşlemi
  document.getElementById('login-btn').addEventListener('click', async () => {
    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    if (!email || !password) {
      alert('Lütfen e-posta ve şifre girin.');
      return;
    }

    const { data, error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      alert('Giriş Hatası: ' + error.message);
    } else {
      alert('Giriş başarılı! Hoş geldiniz.');
    }
  });
</script>

</body>
</html>
