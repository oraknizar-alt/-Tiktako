<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HediyeBox - TikTok Overlay</title>
  <link rel="stylesheet" href="./style.css">
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <!-- HEDİYEBOX CANLI OVERLAY ALANI -->
  <div id="overlay-container">
    
    <!-- 0. Takipçi Bildirim Kartı (2.5 cm boyutunda) -->
    <div id="follower-card" class="hb-card follower-card hidden">
      <div class="user-avatar">👤</div>
      <div class="hb-details">
        <h4 id="follower-name">@kullanici</h4>
        <p>Aramıza katıldı! 🎉</p>
      </div>
    </div>

    <!-- 1. Hediye Kartı (Gül / Aslan vb. Geldiğinde Çıkan Kart) -->
    <div id="gift-card" class="hb-card hidden">
      <div class="hb-gift-icon-wrap">
        <img id="gift-icon" src="https://p16-webcast.tiktokcdn.com/webcast/58ed6ff73fb8953110e536bf30424a73.png" alt="Hediye">
      </div>
      <div class="hb-details">
        <h4 id="gift-sender">@kullanici</h4>
        <p id="gift-message">Gül gönderdi!</p>
      </div>
    </div>

    <!-- 2. Video Bildirimi (Özel Hediyelerde Ekranda Oynayan Video) -->
    <div id="video-alert-box" class="hidden">
      <video id="alert-video" width="300" src=""></video>
    </div>

    <!-- 3. Beğeni Bildirimi -->
    <div id="like-badge" class="hb-badge">
      <span class="heart-pulse">❤️</span>
      <span id="like-count">0</span>
    </div>

  </div>

  <script src="./script.js"></script>
</body>
</html>
