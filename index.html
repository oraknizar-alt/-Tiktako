<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>TikTok Hediye Ekranı</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; }
    body { background-color: #0b0e14; color: #fff; min-height: 100vh; padding: 15px; overflow-x: hidden; }

    h2 { text-align: center; color: #00f2fe; margin-bottom: 15px; font-size: 20px; }

    /* FİGÜRAN HEDİYE EKRANI */
    #canvas-container {
      position: relative; width: 100%; height: 380px; background: #121622;
      border-radius: 18px; border: 2px dashed #00f2fe; overflow: hidden; margin-bottom: 20px;
      box-shadow: inset 0 0 20px rgba(0, 242, 254, 0.1);
    }

    .info-text {
      position: absolute; top: 10px; width: 100%; text-align: center;
      font-size: 11px; color: rgba(255,255,255,0.4); pointer-events: none;
    }

    /* SÜRÜKLENEBİLİR FİGÜRAN HEDİYE */
    .draggable-gift {
      position: absolute; display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(20, 24, 38, 0.95); border: 2px solid #ff0050; border-radius: 16px;
      padding: 8px 12px; min-width: 85px; cursor: move; touch-action: none;
      box-shadow: 0 4px 15px rgba(255, 0, 80, 0.4); backdrop-filter: blur(8px);
    }
    
    .draggable-gift img { width: 45px; height: 45px; object-fit: contain; pointer-events: none; }
    
    .draggable-gift .gift-tag {
      font-size: 11px; font-weight: 900; color: #fff; background: #ff0050;
      padding: 3px 8px; border-radius: 6px; text-transform: uppercase; margin-top: 5px;
      text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .draggable-gift .remove-btn {
      position: absolute; top: -6px; right: -6px; background: #ff0050; color: #fff;
      border-radius: 50%; width: 20px; height: 20px; font-size: 11px; border: none; font-weight: bold; cursor: pointer;
    }

    /* KONTROL PANELİ */
    .panel { background: #161b26; border-radius: 16px; padding: 15px; border: 1px solid #232a3b; }
    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: #8e94a7; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 12px; background: #0b0e14; border: 1px solid #232a3b; border-radius: 10px; color: #fff; font-size: 14px; outline: none; }
    
    .btn { width: 100%; padding: 14px; border: none; border-radius: 10px; font-weight: 700; font-size: 15px; cursor: pointer; background: #00f2fe; color: #000; margin-top: 5px; }
  </style>
</head>
<body>

  <h2>🎁 TikTok Hediye Figüran Paneli</h2>

  <!-- FİGÜRLERİN YERLEŞTİRİLDİĞİ EKRAN -->
  <div id="canvas-container">
    <div class="info-text">📍 Eklediğin hediyeleri parmağınla istediğin yere sürükle</div>
  </div>

  <!-- HEDİYE EKLEME FORMU -->
  <div class="panel">
    <div class="form-group">
      <label>TikTok Hediyesi Seçin</label>
      <select id="gift-select" class="form-control">
        <option value="🌹|TAKLA AT|https://p16-webcast.tiktokcdn.com/webcast/58ed6ff73fb8953110e536bf30424a73.png">🌹 Gül</option>
        <option value="🍩|TWERK AT|https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/gift_donut.png">🍩 Donut</option>
        <option value="🦁|BAYILT|https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/gift_lion.png">🦁 Aslan</option>
        <option value="🍦|SUS LAN|https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/gift_icecream.png">🍦 Dondurma</option>
        <option value="🧿|GERİ|https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/gift_nazar.png">🧿 Nazar Boncuğu</option>
        <option value="☕|RESET|https://p16-webcast.tiktokcdn.com/img/maliva/webcast-va/resource/gift_coffee.png">☕ Kahve</option>
      </select>
    </div>

    <div class="form-group">
      <label>Altına Yazılacak Özel Yazı</label>
      <input type="text" id="gift-text" class="form-control" placeholder="Örn: TAKLA AT / BAYILT / RESET">
    </div>

    <button class="btn" onclick="addGift()">+ Hediyeyi Ekrana Ekle</button>
  </div>

  <script>
    const canvas = document.getElementById('canvas-container');

    function addGift() {
      const selectVal = document.getElementById('gift-select').value.split('|');
      const defaultText = selectVal[1];
      const giftImgUrl = selectVal[2];
      const customText = document.getElementById('gift-text').value.trim() || defaultText;

      // Hediye Elemanı Oluşturma
      const giftEl = document.createElement('div');
      giftEl.className = 'draggable-gift';
      giftEl.style.top = '50px';
      giftEl.style.left = '50px';

      giftEl.innerHTML = `
        <button class="remove-btn" onclick="this.parentElement.remove()">✕</button>
        <img src="${giftImgUrl}" alt="Gift">
        <div class="gift-tag">${customText}</div>
      `;

      canvas.appendChild(giftEl);
      makeDraggable(giftEl);
      
      // Yazı alanını temizle
      document.getElementById('gift-text').value = '';
    }

    // TELEFONDA PARMAKLA SÜRÜKLEME MANTIĞI
    function makeDraggable(elmnt) {
      let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;

      elmnt.ontouchstart = function(e) {
        const touch = e.touches[0];
        pos3 = touch.clientX;
        pos4 = touch.clientY;

        document.ontouchend = function() {
          document.ontouchmove = null;
        };

        document.ontouchmove = function(e) {
          const t = e.touches[0];
          pos1 = pos3 - t.clientX;
          pos2 = pos4 - t.clientY;
          pos3 = t.clientX;
          pos4 = t.clientY;

          let newTop = elmnt.offsetTop - pos2;
          let newLeft = elmnt.offsetLeft - pos1;

          // Ekran dışına çıkmasını engelle
          if(newTop > 0 && newTop < (canvas.offsetHeight - 80)) elmnt.style.top = newTop + "px";
          if(newLeft > 0 && newLeft < (canvas.offsetWidth - 80)) elmnt.style.left = newLeft + "px";
        };
      };
    }
  </script>
</body>
</html>
