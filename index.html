<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TikTok Live Overlay Platformu</title>
  <link rel="stylesheet" href="style.css">
  <!-- Canvas Confetti & Canvas Fireworks Kütüphanesi -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
  <!-- Socket.io bağlantısı -->
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>

  <!-- 1. HAVAİ FİŞEK VE TAKİPÇİ BİLDİRİMİ (Yaklaşık 2.5 cm boyutunda) -->
  <div id="follower-alert" class="alert-card hidden">
    <div class="user-avatar">👤</div>
    <div class="alert-info">
      <span id="follower-name" class="username">@kullanici</span>
      <span class="action-text">takip etti! 🎉</span>
    </div>
  </div>

  <!-- 2. HEDİYE EKRANI (TikFinity Tarzı) -->
  <div id="gift-alert" class="gift-card hidden">
    <img id="gift-icon" src="" alt="Hediye">
    <div class="gift-details">
      <h3 id="gift-sender">@kullanici</h3>
      <p id="gift-desc">Gül gönderdi!</p>
    </div>
  </div>

  <!-- 3. BEĞENİ TABLOSU / SAYAÇ -->
  <div id="like-counter-box">
    <span class="heart-icon">❤️</span>
    <span id="like-count">0</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
